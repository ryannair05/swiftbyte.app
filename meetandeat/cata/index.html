              <a class="button primary" href="meetandeat://cata">Open in Halls</a>

            </div>
          </div>

              <circle class="stop" cx="390" cy="642" r="9" />

              <figure class="station">

                <figcaption><strong>Pick your routes</strong><span>Show just the ones you ride.</span></figcaption>

                <img src="/assets/renders/cata-stop.webp" width="760" height="1296" alt="Upcoming departures at E College Ave at Atherton Hall, in minutes" />
                <figcaption><strong>Check your stop</strong><span>The next buses, and how many minutes away they are.</span></figcaption>
