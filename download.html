<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Download Halls</title>
<script>
  (function() {
    var ua = navigator.userAgent || navigator.vendor || window.opera;
    var iosUrl = "https://apps.apple.com/us/app/halls-campus-dining/id6446225508?itscg=30200&itsct=apps_box_badge&mttnsubad=6446225508";
    var androidUrl = "https://play.google.com/store/apps/details?id=com.ryannair05.meetandeat";
    var mainSiteUrl = "https://swiftbyte.app/";

    var destUrl;

    if (/android/i.test(ua)) {
      destUrl = androidUrl;
    } else if (/iPad|iPhone/.test(ua) && !window.MSStream) {
      destUrl = iosUrl;
    } else {
      destUrl = mainSiteUrl;
    }

    // Redirect immediately
    window.location.replace(destUrl);

    // Also set the fallback link href now for users who might see the page
    document.addEventListener("DOMContentLoaded", function() {
      var fallback = document.getElementById("fallback-link");
      if (fallback) fallback.href = destUrl;
    });
  })();
</script>
</head>
<body>
<p>Redirecting you to the right download page… If you are not redirected, <a id="fallback-link" href="https://swiftbyte.app/">click here</a>.</p>
</body>
</html>
